services:
  - type: web
    name: acu-gate
    runtime: node
    region: oregon
    # Free plan sleeps when idle (~30-60s cold start); the app tolerates it.
    plan: free
    rootDir: services/acu-gate
    buildCommand: npm ci
    startCommand: npm run migrate && node src/server.ts
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PORT
        value: "10000"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ENTITLEMENT_PRIVATE_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
