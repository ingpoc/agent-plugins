<span data-acu-counter="https://acu-gate.onrender.com">Unlocks: —</span>
<script>
(()=>{const element=document.currentScript.previousElementSibling;fetch(element.dataset.acuCounter+'/v1/public/counter').then(r=>r.json()).then(data=>{element.textContent='Unlocks: '+Number(data.unlocks).toLocaleString();}).catch(()=>{});})();
</script>
