<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Comet Control</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html{background:transparent}
    body{width:340px;min-height:200px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0f;color:#e4e4e7;overflow:hidden;border-radius:14px;border:1px solid rgba(255,255,255,0.07)}
    .header{padding:16px 18px 12px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:10px}
    .logo{width:28px;height:28px;background:linear-gradient(160deg,#103247,#06141d);border:1px solid rgba(63,201,239,0.25);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 10px rgba(31,166,214,0.25)}
    .logo svg{width:17px;height:17px;display:block;filter:drop-shadow(0 0 3px rgba(63,201,239,0.7))}
    .hdr{flex:1}
    .hdr h1{font-size:13px;font-weight:600;color:#f4f4f5}
    .hdr p{font-size:11px;color:#71717a;margin-top:1px}
    .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;position:relative}
    .dot.ok{background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,0.5)}
    .dot.ok::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:1px solid rgba(34,197,94,0.3);animation:pulse 2s ease-out infinite}
    .dot.bad{background:#ef4444}
    .dot.warn{background:#eab308}
    @keyframes pulse{0%{transform:scale(1);opacity:1}100%{transform:scale(2);opacity:0}}
    .body{padding:14px 18px}
    .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    .row:last-child{margin-bottom:0}
    .lbl{font-size:11px;color:#71717a;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
    .val{font-size:12px;font-weight:600}
    .val.ok{color:#22c55e}.val.bad{color:#ef4444}.val.warn{color:#eab308}
    .section{padding:14px 18px;border-top:1px solid rgba(255,255,255,0.06)}
    .section-title{font-size:11px;color:#71717a;font-weight:500;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
    .card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:10px 12px}
    .card-title{font-size:12px;font-weight:500;color:#e4e4e7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
    .card-url{font-size:11px;color:#52525b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .empty{font-size:12px;color:#52525b;font-style:italic;padding:4px 0}
    .mono{font-size:11px;font-family:'SF Mono','Fira Code',monospace;color:#a1a1aa}
    .footer{padding:10px 18px;background:rgba(255,255,255,0.02);border-top:1px solid rgba(255,255,255,0.04);text-align:center}
    .footer span{font-size:10px;color:#3f3f46}
    .err{font-size:11px;color:#f87171;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);border-radius:6px;padding:8px 12px;margin:12px 18px 0;display:none}
    .err.show{display:block}
    .badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;margin-left:4px}
    .badge.ok{background:rgba(34,197,94,0.15);color:#22c55e}
    .badge.bad{background:rgba(239,68,68,0.15);color:#ef4444}
    .toggle{position:relative;width:34px;height:18px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-radius:10px;cursor:pointer;transition:background 0.15s,border-color 0.15s;flex-shrink:0}
    .toggle::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#71717a;transition:left 0.15s,background 0.15s}
    .toggle.on{background:rgba(31,166,214,0.45);border-color:rgba(63,201,239,0.65)}
    .toggle.on::after{left:18px;background:#fff}
    .toggle.danger.on{background:#dc2626;border-color:#ef4444}
    .toggle.busy{opacity:0.5;cursor:wait}
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs><linearGradient id="lp" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
          <stop offset="0" stop-color="#9fe9ff"/><stop offset="0.45" stop-color="#3fc9ef"/><stop offset="1" stop-color="#0c93c9"/>
        </linearGradient></defs>
        <path d="M27.4 4.8C15.9 1.2 5.1 8.1 2.7 20.0C1.5 25.5 2.1 31.4 4.0 36.7L164.9 486.1C169.0 497.7 177.2 507.2 188.1 507.2C198.5 507.2 204.0 499.0 207.5 488.8L275.9 277.9L493.6 201.8C504.2 198.1 511.1 191.4 510.6 183.6C510.1 176.2 503.4 170.6 493.1 167.2L38.5 8.1C34.9 6.8 31.1 5.9 27.4 4.8Z"
          fill="url(#lp)" stroke="#bff0ff" stroke-width="10" stroke-opacity="0.5" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="hdr">
      <h1>OWL · Comet Control</h1>
      <p id="sub">Loading…</p>
    </div>
    <div id="dot" class="dot warn"></div>
  </div>
  <div id="err" class="err"></div>
  <div class="body">
    <div class="row"><span class="lbl">Extension</span><span id="ext-status" class="val warn">—</span></div>
    <div class="row"><span class="lbl">Content Script</span><span id="cs-status" class="val warn">—</span></div>
    <div class="row"><span class="lbl">Pause control</span><div id="pause-toggle" class="toggle danger" role="switch" aria-checked="false" tabindex="0"></div></div>
    <div class="row"><span class="lbl">Feedback Mode</span><div id="feedback-toggle" class="toggle" role="switch" aria-checked="false" tabindex="0"></div></div>
    <div class="row" id="feedback-err-row" style="display:none"><span class="lbl">&nbsp;</span><span id="feedback-err" class="val bad" style="font-size:10px;font-weight:400">—</span></div>
    <div class="row" style="margin-top:4px"><span class="lbl">Queue origin</span><input id="queue-origin" type="text" placeholder="same-origin (default)" spellcheck="false" autocomplete="off" style="flex:0 0 200px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#e4e4e7;font-size:11px;font-family:'SF Mono','Fira Code',monospace;padding:4px 8px;outline:none" /></div>
    <div class="row" id="queue-origin-hint-row" style="display:none"><span class="lbl">&nbsp;</span><span id="queue-origin-hint" style="font-size:10px;color:#52525b">—</span></div>
  </div>
  <div class="section">
    <div class="section-title">Active Tab</div>
    <div id="tab"><div class="empty">Loading…</div></div>
  </div>
  <div class="section">
    <div class="row"><span class="lbl">Extension ID</span><span id="ext-id" class="mono">—</span></div>
    <div class="row"><span class="lbl">Broker</span><span id="broker-status" class="val warn">—</span></div>
    <div class="row"><span class="lbl">Protocol</span><span id="protocol" class="mono">—</span></div>
    <div class="row"><span class="lbl">Sessions</span><span id="sessions" class="mono">—</span></div>
    <div class="row"><span class="lbl">Build</span><span id="build" class="mono">—</span></div>
    <div class="row"><span class="lbl">Bridge Socket</span><span id="sock" class="mono">—</span></div>
  </div>
  <div class="footer"><span id="footer-version">comet-control</span></div>
  <script src="popup.js"></script>
</body>
</html>
