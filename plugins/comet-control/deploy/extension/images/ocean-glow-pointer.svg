<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 560 560" role="img" aria-labelledby="title desc">
  <title id="title">Ocean glow pointer</title>
  <desc id="desc">A dark blue pointer shape with a small soft ocean-colored glow behind it.</desc>
  <defs>
    <filter id="ocean-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feColorMatrix
        in="blur"
        type="matrix"
        values="0 0 0 0 0.04
                0 0 0 0 0.62
                0 0 0 0 0.82
                0 0 0 0.72 0"
        result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#ocean-glow)">
    <path
      d="M27.4 4.8
         C15.9 1.2 5.1 8.1 2.7 20.0
         C1.5 25.5 2.1 31.4 4.0 36.7
         L164.9 486.1
         C169.0 497.7 177.2 507.2 188.1 507.2
         C198.5 507.2 204.0 499.0 207.5 488.8
         L275.9 277.9
         L493.6 201.8
         C504.2 198.1 511.1 191.4 510.6 183.6
         C510.1 176.2 503.4 170.6 493.1 167.2
         L38.5 8.1
         C34.9 6.8 31.1 5.9 27.4 4.8
         Z"
      fill="#263f50"
      stroke="#172b38"
      stroke-width="2"
      stroke-linejoin="round"
      vector-effect="non-scaling-stroke" />
  </g>
</svg>
