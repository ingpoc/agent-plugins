<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Animated pointer shape</title>
  <desc id="desc">A dark blue angular pointer shape with a subtle floating and pulsing animation.</desc>
  <defs>
    <filter id="ocean-glow" x="-18%" y="-18%" width="136%" height="136%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feColorMatrix
        in="blur"
        type="matrix"
        values="0 0 0 0 0.04
                0 0 0 0 0.62
                0 0 0 0 0.82
                0 0 0 0.52 0"
        result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    .pointer {
      animation: float 1.8s ease-in-out infinite;
      transform-origin: 256px 256px;
    }

    @keyframes float {
      0%,
      100% {
        transform: translate(0, 0) rotate(0deg) scale(1);
        opacity: 0.98;
      }
      50% {
        transform: translate(2px, -1px) rotate(0.5deg) scale(1.01);
        opacity: 1;
      }
    }
  </style>
  <path
    class="pointer"
    filter="url(#ocean-glow)"
    d="M27.4 4.8
       C15.9 1.2 5.1 8.1 2.7 20.0
       C1.5 25.5 2.1 31.4 4.0 36.7
       L164.9 486.1
       C169.0 497.7 177.2 507.2 188.1 507.2
       C198.5 507.2 204.0 499.0 207.5 488.8
       L275.9 277.9
       L493.6 201.8
       C504.2 198.1 511.1 191.4 510.6 183.6
       C510.1 176.2 503.4 170.6 493.1 167.2
       L38.5 8.1
       C34.9 6.8 31.1 5.9 27.4 4.8
       Z"
    fill="#11161b"
    stroke="#11161b"
    stroke-width="2"
    stroke-linejoin="round"
    vector-effect="non-scaling-stroke"
  />
</svg>
