<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:; img-src data:; connect-src 'self'">
<meta name="color-scheme" content="light dark">
<title>Context Ledger</title>
<style>/* Signal design tokens: Context Ledger. One block; light/dark via light-dark() + color-scheme. */
:root{
  /* palette: ledger paper and ink (light, dark) */
  --paper:light-dark(#F7F8FA,#0B0D10);      /* app ground */
  --sheet:light-dark(#FFFFFF,#12151A);      /* panels, detail */
  --sheet-2:light-dark(#EEF1F5,#1A1F27);    /* hover, nested */
  --rule:light-dark(#D8DEE8,#2A3140);       /* hairline structure */
  --rule-soft:light-dark(#E8ECF2,#1E2430);  /* row dividers */
  --ink:light-dark(#0B0D10,#F2F4F7);        /* primary text */
  --ink-muted:light-dark(#545D68,#A3ACBA);  /* secondary text, >=4.5:1 */
  --ink-faint:light-dark(#656D7A,#8D95A2);  /* tertiary text, >=4.5:1 on paper/sheet */
  /* the one accent */
  --accent:light-dark(#2F6FED,#5B8CFF);
  --accent-ink:light-dark(#2459C9,#7FA5FF); /* accent as small text */
  --accent-wash:light-dark(rgba(47,111,237,.09),rgba(91,140,255,.10));
  --accent-wash-2:light-dark(rgba(47,111,237,.16),rgba(91,140,255,.18));
  /* outcome semantics: mark colour + text colour */
  --pos:light-dark(#0F9F6E,#3DDC97);  --pos-ink:light-dark(#0B7A55,#3DDC97);       /* helped */
  --caution:light-dark(#C9920A,#F5C542); --caution-ink:light-dark(#875F00,#F5C542); /* not helped, sample tag */
  --neg:light-dark(#D93B3B,#FF6B6B);  --neg-ink:light-dark(#B42727,#FF7A7A);       /* misled */
  --neutral-mark:light-dark(#9AA3B2,#6B7380);                                     /* neutral */
  --shadow-overlay:0 8px 24px light-dark(rgba(0,0,0,.08),rgba(0,0,0,.35));
  --scrim:light-dark(rgba(11,13,16,.28),rgba(0,0,0,.5));
  /* type */
  --font-sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --text-2xs:11px; --text-xs:12px; --text-dense:13px; --text-sm:14px; --text-ui:15px;
  --text-base:16px; --text-md:18px; --text-lg:21px; --text-xl:24px;
  --weight-regular:400; --weight-medium:500; --weight-semibold:600;
  --tracking-caps:.06em; --tracking-display:-.02em;
  /* spacing (4px base) */
  --space-0:0; --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
  --space-6:24px; --space-8:32px; --space-10:40px; --space-12:48px; --space-14:56px;
  /* radii, hairlines, targets */
  --radius-xs:4px; --radius-sm:6px; --radius-md:8px; --radius-lg:12px;
  --hairline:1px; --hairline-strong:1.5px; --focus-ring:2px; --target:44px;
  /* motion */
  --ease:cubic-bezier(.2,.8,.2,1); --dur-short:140ms; --dur-med:220ms;
  color-scheme:light dark;
}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:400 var(--text-ui)/1.45 var(--font-sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
::selection{background:var(--accent-wash-2);color:var(--ink)}
input,select,button{font:inherit;color:inherit}
input{caret-color:var(--accent)}
*{scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--rule);border-radius:10px;border:3px solid var(--paper)}
:focus-visible{outline:var(--focus-ring) solid var(--accent);outline-offset:2px;border-radius:var(--radius-xs)}
.mono{font-family:var(--font-mono);font-feature-settings:"zero" 1}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{cursor:pointer;background:none;border:0;padding:0}
mark{background:var(--accent-wash-2);color:inherit;border-radius:var(--radius-xs);padding:0 1px}
kbd{font:500 var(--text-2xs)/1 var(--font-mono);border:var(--hairline) solid var(--rule);border-bottom-width:2px;border-radius:var(--radius-xs);padding:2px 5px;color:var(--ink-muted);background:var(--sheet)}

/* shell */
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr;max-width:1520px;margin:0 auto}
.top{display:flex;align-items:center;gap:var(--space-3);padding:10px var(--space-4) var(--space-2);border-bottom:var(--hairline) solid var(--rule-soft)}
.mark{display:flex;align-items:baseline;gap:10px;min-width:0}
.mark h1{font:600 var(--text-base)/1.2 var(--font-sans);letter-spacing:-.01em;margin:0;white-space:nowrap}
.mark .count{font:400 var(--text-xs)/1.2 var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.sample{font:500 var(--text-2xs)/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--caution-ink);border:var(--hairline) dashed currentColor;border-radius:var(--radius-sm);padding:var(--space-1) 6px;white-space:nowrap}
.top .sp{flex:1}
.btn{min-height:var(--target);min-width:var(--target);display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);padding:0 var(--space-3);border-radius:var(--radius-md);border:var(--hairline) solid var(--rule);background:var(--sheet);color:var(--ink);font:500 var(--text-dense)/1 var(--font-sans);transition:background var(--dur-short) var(--ease),border-color var(--dur-short) var(--ease)}
.btn:hover{background:var(--sheet-2)}
.btn:active{transform:scale(.98)}
.btn svg{width:16px;height:16px;flex:none}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sheet-2)}
.btn[aria-pressed=true],.btn[aria-expanded=true]{border-color:var(--accent);color:var(--accent-ink)}
.ico{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.tabs{display:flex;gap:var(--space-1);padding:0 var(--space-3);border-bottom:var(--hairline) solid var(--rule)}
.tab{position:relative;min-height:var(--target);padding:0 var(--space-3);font:500 var(--text-sm)/1 var(--font-sans);color:var(--ink-muted);display:inline-flex;align-items:center;gap:var(--space-2);border-radius:var(--radius-md) var(--radius-md) 0 0}
.tab:hover{color:var(--ink);background:var(--sheet-2)}
.tab[aria-selected=true]{color:var(--ink)}
.tab[aria-selected=true]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--accent)}
.tab .n{font:400 var(--text-xs)/1 var(--font-mono);color:var(--ink-faint)}
.tabs .hint{margin-left:auto;align-self:center;font-size:var(--text-xs);color:var(--ink-faint);display:flex;gap:6px;align-items:center}
.panel{min-height:0;overflow:hidden}
.panel[hidden]{display:none}

/* decisions split */
#p-decisions{display:grid;grid-template-columns:1fr;min-height:0;height:100%}
.listcol{display:grid;grid-template-rows:auto auto 1fr;min-height:0;border-right:var(--hairline) solid var(--rule)}
.tools{padding:var(--space-3) var(--space-4) var(--space-2);display:grid;gap:var(--space-2)}
.searchrow{display:flex;gap:var(--space-2)}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;left:12px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--ink-faint);pointer-events:none}
.search input{width:100%;min-height:var(--target);padding:0 var(--space-14) 0 36px;border:var(--hairline) solid var(--rule);border-radius:var(--radius-md);background:var(--sheet);outline:0}
.search input::placeholder{color:var(--ink-faint)}
.search input:focus-visible{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:var(--space-2)}
.filters[hidden]{display:none}
.field{display:grid;gap:3px;min-width:0}
.field label,.field .lab{font:500 var(--text-2xs)/1.2 var(--font-sans);color:var(--ink-muted);letter-spacing:.04em;text-transform:uppercase}
.field select,.field input{width:100%;min-height:36px;border:var(--hairline) solid var(--rule);border-radius:var(--radius-sm);background:var(--sheet);padding:0 var(--space-2);font-size:var(--text-dense)}
.field select:hover{border-color:var(--ink-faint)}
.custom{grid-column:1/-1;display:flex;gap:var(--space-2)}
.custom[hidden]{display:none}
.custom .field{flex:1}
.resultline{display:flex;align-items:center;gap:var(--space-2);padding:6px var(--space-4) var(--space-2);font:400 var(--text-xs)/1.3 var(--font-mono);color:var(--ink-muted);border-bottom:var(--hairline) solid var(--rule)}
.resultline .sp{flex:1}
.linkbtn{color:var(--accent-ink);font:500 var(--text-xs)/1 var(--font-sans);min-height:32px;padding:0 6px;border-radius:var(--radius-sm)}
.linkbtn:hover{background:var(--accent-wash)}

.list{list-style:none;margin:0;padding:0;overflow:auto;min-height:0;overscroll-behavior:contain}
.row{display:grid;grid-template-columns:30px 1fr auto;gap:2px 10px;width:100%;text-align:left;padding:var(--space-3) var(--space-4) var(--space-3) 10px;border-bottom:var(--hairline) solid var(--rule-soft);transition:background var(--dur-short) var(--ease);min-height:var(--target)}
.row:hover{background:var(--sheet-2)}
.row[aria-current=true]{background:var(--accent-wash)}
.row:focus-visible{outline-offset:-2px;border-radius:0}
.rank{grid-row:1/4;display:flex;flex-direction:column;align-items:center;gap:var(--space-1);padding-top:2px}
.rank b{font:600 var(--text-xs)/1 var(--font-mono);color:var(--ink-muted)}
.rank svg{width:10px;height:10px}
.r1 b{color:var(--accent-ink)}
.r1 .sq{fill:var(--accent);stroke:var(--accent)}
.r2 .sq{fill:none;stroke:var(--ink-faint)}
.dtext{font:500 var(--text-ui)/1.35 var(--font-sans);letter-spacing:-.005em;color:var(--ink);min-width:0;text-wrap:pretty}
.why{grid-column:2;font:400 var(--text-dense)/1.4 var(--font-sans);color:var(--ink-muted);min-width:0;text-wrap:pretty}
.why i{font-style:normal;font:500 var(--text-2xs)/1 var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin-right:6px}
.meta{grid-column:2/4;display:flex;flex-wrap:wrap;gap:var(--space-1) 10px;align-items:center;margin-top:var(--space-1);font:400 var(--text-xs)/1.3 var(--font-mono);color:var(--ink-muted)}
.meta .id{color:var(--ink)}
.cit{grid-column:3;grid-row:1/3;display:flex;flex-direction:column;align-items:flex-end;gap:3px;padding-top:3px}
.cit svg{display:block}
.cit span{font:500 var(--text-xs)/1 var(--font-mono);color:var(--ink-muted)}
.row.superseded .dtext{color:var(--ink-muted);text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:var(--ink-faint)}
.badge{display:inline-flex;align-items:center;gap:5px;font:500 var(--text-2xs)/1 var(--font-mono);letter-spacing:.02em;padding:3px 6px;border-radius:var(--radius-sm);border:var(--hairline) solid var(--rule);color:var(--ink-muted);white-space:nowrap}
.badge.sup{border-style:dashed}
.badge.mis{color:var(--neg-ink);border-color:color-mix(in srgb,var(--neg) 45%,transparent)}
.badge.nh{color:var(--caution-ink);border-color:color-mix(in srgb,var(--caution) 55%,transparent)}
.badge.ok{color:var(--pos-ink);border-color:color-mix(in srgb,var(--pos) 45%,transparent)}
.badge.acc{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.empty{padding:var(--space-8) var(--space-4);color:var(--ink-muted);font-size:var(--text-sm)}
.empty strong{display:block;color:var(--ink);font-weight:600;margin-bottom:var(--space-1)}

/* detail */
.detailcol{min-height:0;display:grid;grid-template-rows:auto 1fr;background:var(--sheet)}
.dhead{display:flex;align-items:center;gap:6px;padding:6px var(--space-3);border-bottom:var(--hairline) solid var(--rule);min-height:57px}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;overflow:hidden;flex:1}
.crumbs ol{display:flex;align-items:center;list-style:none;margin:0;padding:0;gap:2px;min-width:0;overflow:hidden}
.crumbs li{display:flex;align-items:center;gap:2px;flex:none}
.crumbs li+li::before{content:"";width:5px;height:5px;border-right:1.5px solid var(--ink-faint);border-top:1.5px solid var(--ink-faint);transform:rotate(45deg);margin:0 6px 0 2px}
.crumbs button{font:500 var(--text-xs)/1 var(--font-mono);color:var(--accent-ink);min-height:36px;padding:0 6px;border-radius:var(--radius-sm)}
.crumbs button:hover{background:var(--accent-wash)}
.crumbs [aria-current=page]{color:var(--ink);font:600 var(--text-xs)/1 var(--font-mono);padding:0 6px}
.dbody{overflow:auto;min-height:0;padding:var(--space-5) var(--space-6) var(--space-12);overscroll-behavior:contain}
.dinner{max-width:880px}
.dtop{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font:400 var(--text-xs)/1 var(--font-mono);color:var(--ink-muted)}
.dtop .id{font-weight:600;color:var(--ink)}
.dbody h2{font:600 var(--text-xl)/1.2 var(--font-sans);letter-spacing:-.02em;margin:var(--space-3) 0 0;text-wrap:balance;max-width:28ch}
.dbody h2:focus,.dbody h2:focus-visible{outline:0}
.d-sup h2{color:var(--ink-muted)}
.because{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:var(--space-1) 14px;align-items:baseline}
.because dt{font:500 var(--text-2xs)/1 var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.because dd{margin:0;font:400 var(--text-md)/1.45 var(--font-sans);color:var(--ink);max-width:46ch;text-wrap:pretty}
.sec{margin-top:var(--space-8)}
.sec>h3{display:flex;align-items:baseline;gap:10px;font:600 var(--text-dense)/1.2 var(--font-sans);margin:0 0 10px;padding-bottom:6px;border-bottom:var(--hairline) solid var(--rule)}
.sec>h3 small{font:400 var(--text-xs)/1 var(--font-mono);color:var(--ink-faint);margin-left:auto}
.trace{display:grid;grid-template-columns:minmax(110px,150px) 1fr;margin:0}
.trace dt,.trace dd{padding:9px 0;border-bottom:var(--hairline) solid var(--rule-soft);margin:0}
.trace dt{font:500 var(--text-xs)/1.4 var(--font-sans);color:var(--ink-muted);padding-right:var(--space-3)}
.trace dd{font-size:var(--text-sm);line-height:1.45}
.trace dd .mono{font-size:var(--text-dense)}
.trace .none{color:var(--ink-faint)}
.confbar{display:flex;align-items:center;gap:10px}
.confbar svg{flex:none}
.plink{display:inline-flex;align-items:baseline;gap:6px;text-align:left;color:var(--accent-ink);border-radius:var(--radius-sm);padding:var(--space-1) 6px;margin:-var(--space-1) -6px;min-height:32px}
.plink:hover{background:var(--accent-wash)}
.plink .mono{font-size:var(--text-xs);font-weight:600}
.plink span+span{color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-1)}
.plist li{display:grid;grid-template-columns:96px 1fr;align-items:baseline;gap:var(--space-2);padding:6px 0;border-bottom:var(--hairline) solid var(--rule-soft)}
.plist .rel{font:500 var(--text-2xs)/1.3 var(--font-mono);color:var(--ink-faint);text-transform:lowercase}

/* chain */
.chain{list-style:none;margin:0;padding:0;display:grid}
.cnode{display:grid;grid-template-columns:28px 1fr;gap:0 var(--space-3);width:100%;text-align:left;padding:10px var(--space-3) 10px var(--space-1);border-radius:var(--radius-md);border:var(--hairline) solid transparent;transition:background var(--dur-short) var(--ease)}
.cnode:hover{background:var(--sheet-2)}
.cnode.here{border-color:var(--rule)}
.cnode .gut{display:flex;justify-content:center;padding-top:3px}
.cnode .gut svg{width:16px;height:16px}
.cnode .t,.cnode .w{display:block}
.cnode .k{font:500 var(--text-2xs)/1.2 var(--font-mono);color:var(--ink-faint);letter-spacing:.02em;display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
.cnode .t{font:500 var(--text-ui)/1.35 var(--font-sans);margin-top:3px}
.cnode .w{font-size:var(--text-dense);color:var(--ink-muted);margin-top:2px}
.cnode.old .t{color:var(--ink-muted);text-decoration:line-through;text-decoration-color:var(--ink-faint)}
.cnode.fail .t{font-weight:400;font-style:normal}
.cnode.fail .t::before{content:"\201C"}.cnode.fail .t::after{content:"\201D"}
.clink{display:grid;grid-template-columns:28px 1fr;gap:0 var(--space-3);padding:0 var(--space-3) 0 var(--space-1);min-height:22px;align-items:center}
.clink .line{justify-self:center;width:1px;height:100%;background:var(--rule)}
.clink .lt{font:500 var(--text-2xs)/1 var(--font-mono);color:var(--ink-muted)}
.clink.arrow svg{justify-self:center}
.youare{font:500 var(--text-2xs)/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}

/* graph */
.graph{width:100%;display:block;overflow:visible}
.graph .edge{stroke:var(--rule);stroke-width:1.25;fill:none}
.graph .edge.sup{stroke:var(--ink-faint);stroke-dasharray:3 3}
.graph .node rect{fill:var(--sheet);stroke:var(--rule);stroke-width:1}
.graph .node.center rect{stroke:var(--accent);stroke-width:1.5;fill:var(--accent-wash)}
.graph .node.dim text.lbl{fill:var(--ink-muted)}
.graph .node{cursor:pointer}
.graph .node:hover rect{stroke:var(--accent)}
.graph .node:focus{outline:0}
.graph .node:focus-visible rect{stroke:var(--accent);stroke-width:2}
.graph text{font-family:var(--font-sans);font-size:var(--text-xs);fill:var(--ink)}
.graph text.id{font:600 var(--text-2xs) var(--font-mono);fill:var(--ink-muted)}
.graph text.ax{font:500 var(--text-2xs) var(--font-sans);fill:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase}
.graph .node rect.sq1{fill:var(--accent);stroke:var(--accent)}.graph .node rect.sq2{fill:none;stroke:var(--ink-faint)}

/* small data */
.stats{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-6);font:400 var(--text-dense)/1.4 var(--font-sans);color:var(--ink-muted);margin-bottom:var(--space-3)}
.stats b{font:600 var(--text-ui)/1 var(--font-mono);color:var(--ink);margin-right:var(--space-1)}
.evlist{list-style:none;margin:0;padding:0}
.ev{display:grid;grid-template-columns:92px 84px 1fr;gap:var(--space-2);align-items:baseline;padding:7px 0;border-bottom:var(--hairline) solid var(--rule-soft);font-size:var(--text-dense)}
.ev time{font:400 var(--text-xs)/1.3 var(--font-mono);color:var(--ink-muted)}
.ev .who{font:500 var(--text-xs)/1.3 var(--font-sans)}
.ev .what{min-width:0;color:var(--ink-muted)}
.ev .what b{font-weight:500;color:var(--ink)}
.k-ok{color:var(--pos-ink)}.k-mis{color:var(--neg-ink)}.k-nh{color:var(--caution-ink)}.k-neu{color:var(--ink-muted)}

.placeholder{display:grid;place-content:center;height:100%;color:var(--ink-muted);text-align:center;padding:var(--space-6);font-size:var(--text-sm);gap:var(--space-2)}

/* activity & outcomes */
.scroll{overflow:auto;height:100%;padding:var(--space-4) var(--space-4) var(--space-12)}
.wrap{max-width:1180px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-3);align-items:end;margin-bottom:var(--space-4)}
.bar .field{width:150px}
.lede{font-size:var(--text-dense);color:var(--ink-muted);margin:0 0 var(--space-4);max-width:70ch}
.lanes{width:100%;display:block}
.lanes text{font-family:var(--font-sans);font-size:var(--text-xs);fill:var(--ink)}
.lanes .tick{font:400 var(--text-2xs) var(--font-mono);fill:var(--ink-faint)}
.lanes .num{font:400 var(--text-xs) var(--font-mono);fill:var(--ink-muted)}
.lanes .rule{stroke:var(--rule-soft)}
.lanes .base{stroke:var(--rule)}
.lanes .lk{stroke:var(--ink-faint);stroke-width:1}
.lanes .ap{fill:var(--accent)}
.lanes .o-helped{fill:var(--pos)}.lanes .o-neutral{fill:none;stroke:var(--neutral-mark);stroke-width:1.3}.lanes .o-not_helped{fill:var(--caution)}.lanes .o-misled{fill:var(--neg)}
.lanes .hit{fill:transparent;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px var(--space-4);font-size:var(--text-xs);color:var(--ink-muted);margin:var(--space-2) 0 var(--space-5);align-items:center}
.legend svg{vertical-align:-2px;margin-right:6px}
.daygroup h4{font:600 var(--text-xs)/1 var(--font-mono);color:var(--ink-muted);margin:18px 0 var(--space-1);padding-bottom:6px;border-bottom:var(--hairline) solid var(--rule)}
.alog{list-style:none;margin:0;padding:0}
.alog li button{display:grid;grid-template-columns:48px 88px 1fr auto;gap:var(--space-2);align-items:baseline;width:100%;text-align:left;padding:var(--space-2) var(--space-1);border-bottom:var(--hairline) solid var(--rule-soft);min-height:var(--target);font-size:var(--text-dense)}
.alog li button:hover{background:var(--sheet-2)}
.alog time{font:400 var(--text-xs) var(--font-mono);color:var(--ink-muted)}
.alog .who{font-weight:500}
.alog .what{color:var(--ink-muted);min-width:0}
.alog .what b{color:var(--ink);font-weight:500}
.alog .kind{font:500 var(--text-2xs)/1 var(--font-mono)}
.more{margin-top:var(--space-3)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 var(--space-6);border-bottom:var(--hairline) solid var(--rule);margin-bottom:var(--space-6)}
.kpi{padding:var(--space-3) 0;display:grid;gap:var(--space-1);border-top:var(--hairline) solid var(--rule)}
.kpi .v{font:600 var(--text-xl)/1.1 var(--font-mono);letter-spacing:-.01em}
.kpi .v small{font:400 var(--text-xs) var(--font-mono);color:var(--ink-muted);margin-left:6px}
.kpi .l{font-size:var(--text-xs);color:var(--ink-muted)}
.kpi.primary .v{color:var(--accent-ink)}
h3.h{font:600 var(--text-sm)/1.2 var(--font-sans);margin:28px 0 var(--space-1)}
.multiples{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:var(--space-4) var(--space-5);margin-top:var(--space-3)}
.sm h5{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 var(--space-1);font:600 var(--text-dense)/1.2 var(--font-sans)}
.sm h5 span{font:400 var(--text-xs) var(--font-mono);color:var(--ink-muted)}
.sm svg{width:100%;height:auto;display:block}
.sm .ln{fill:none;stroke:var(--accent);stroke-width:1.5}
.sm .nb{fill:var(--rule)}
.sm .ref{stroke:var(--rule-soft)}
.sm text{font:400 var(--text-2xs) var(--font-mono);fill:var(--ink-faint)}
.sm .end{fill:var(--accent)}
table.otab{width:100%;border-collapse:collapse;margin-top:var(--space-3);font-size:var(--text-dense)}
.otab th{text-align:left;font:500 var(--text-2xs)/1.2 var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);border-bottom:var(--hairline) solid var(--rule);padding:0}
.otab th button{min-height:var(--target);padding:0 var(--space-2) 0 0;display:inline-flex;align-items:center;gap:var(--space-1);letter-spacing:inherit;text-transform:inherit;font:inherit;color:inherit}
.otab th button:hover{color:var(--ink)}
.otab th[aria-sort] button{color:var(--ink)}
.otab th.num,.otab td.num{text-align:right}
.otab th.num button{justify-content:flex-end;padding:0 0 0 var(--space-2)}
.otab td{padding:var(--space-2) var(--space-2) var(--space-2) 0;border-bottom:var(--hairline) solid var(--rule-soft);vertical-align:middle}
.otab td.num{font-family:var(--font-mono);padding:var(--space-2) 0 var(--space-2) var(--space-2)}
.otab td.dec button{text-align:left;display:grid;gap:2px;padding:var(--space-1) 0;min-height:var(--target)}
.otab td.dec .mono{font-size:var(--text-xs);color:var(--ink-muted)}
.otab td.dec .tt{font-weight:500}
.otab td.dec button:hover .tt{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule)}
.otab .mix svg,.otab .trend svg{display:block}
.otab th.trend,.otab td.trend{padding-left:var(--space-4)}
.fineprint{font-size:var(--text-xs);color:var(--ink-muted);margin-top:var(--space-4);max-width:75ch}
footer.fp{padding:var(--space-4) 0 0;font-size:var(--text-xs);color:var(--ink-faint)}

/* responsive */
@media (min-width:760px){
  #p-decisions{grid-template-columns:minmax(330px,40%) 1fr}
  .detailcol .back{display:none}
}
@media (min-width:1200px){
  #p-decisions{grid-template-columns:460px 1fr}
  .dbody{padding:var(--space-6) var(--space-10) var(--space-14)}
}
@media (max-width:759.98px){
  .detailcol{position:fixed;inset:0;z-index:20;transform:translateX(100%);visibility:hidden;transition:transform var(--dur-med) var(--ease),visibility 0s linear var(--dur-med);box-shadow:var(--shadow-overlay)}
  .detailcol.open{transform:none;visibility:visible;transition:transform var(--dur-med) var(--ease)}
  .listcol{border-right:0}
  .tabs .hint{display:none}
  .dbody{padding:var(--space-4) var(--space-4) var(--space-12)}
  .dbody h2{font-size:var(--text-lg)}
  .because{grid-template-columns:1fr}
  .because dd{font-size:var(--text-base)}
  .trace{grid-template-columns:1fr}
  .trace dt{border-bottom:0;padding-bottom:0}
  .trace dd{padding-top:2px}
  .otab .hide-n{display:none}
  .alog li button{grid-template-columns:44px 1fr auto}
  .alog .who{grid-column:2}
  .alog .what{grid-column:2/4}
  .alog .kind{grid-column:3;grid-row:1}
  .ev{grid-template-columns:80px 1fr}
  .ev .what{grid-column:1/-1}
  .mark .count{display:none}
}
@media (max-width:479.98px){
  .top{padding:var(--space-2) var(--space-3)}
  .tools{padding:10px var(--space-3) 6px}
  .row{padding:var(--space-3) var(--space-3) var(--space-3) 6px}
  .resultline{padding:6px var(--space-3) var(--space-2)}
  .themelabel{display:none}
}
@media (min-width:1200px){.filtertoggle{display:none}.filters{grid-template-columns:repeat(3,1fr)}}
@media (max-width:1199.98px){.filters:not(.show){display:none}}
@media (pointer:coarse){.field select,.field input{min-height:44px}.crumbs button,.linkbtn,.plink{min-height:44px}}
@media (prefers-reduced-motion:reduce){
  .detailcol{transition:opacity var(--dur-med) linear,visibility 0s linear var(--dur-med)!important;transform:none!important;opacity:0}
  .detailcol.open{opacity:1;transition:opacity var(--dur-med) linear!important}
  @media (min-width:760px){.detailcol{opacity:1}}
  .row,.btn,.cnode{transition:none}
}
#p-decisions[hidden]{display:none}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="mark">
      <h1>Context Ledger</h1>
      <span class="count" id="ledgerCount"></span>
    </div>
    <span class="badge acc" id="liveTag" title="Real ledger data, opened read-only. Nothing here can change the ledger.">Live · read-only</span>
    <span class="sp"></span>
    <button class="btn ghost" id="themeBtn" type="button" aria-label="Theme: follows system. Switch theme">
      <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11" /><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor" stroke="none"/></svg>
      <span class="themelabel" id="themeLabel">Auto</span>
    </button>
  </header>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button class="tab" role="tab" id="t-decisions" aria-controls="p-decisions" aria-selected="true">Decisions <span class="n" id="n-dec"></span></button>
    <button class="tab" role="tab" id="t-activity" aria-controls="p-activity" aria-selected="false" tabindex="-1">Activity <span class="n" id="n-act"></span></button>
    <button class="tab" role="tab" id="t-outcomes" aria-controls="p-outcomes" aria-selected="false" tabindex="-1">Outcomes <span class="n" id="n-out"></span></button>
    <span class="hint" aria-hidden="true"><kbd>/</kbd> search <kbd>&uarr;</kbd><kbd>&darr;</kbd> move <kbd>&crarr;</kbd> open <kbd>esc</kbd> close</span>
  </nav>

  <main class="panel" id="p-decisions" role="tabpanel" aria-labelledby="t-decisions">
    <section class="listcol" aria-label="Decision list">
      <div class="tools">
        <div class="searchrow">
          <div class="search">
            <label for="q" class="vh">Search decisions, reasons, rules</label>
            <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
            <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search decisions, why, rules" aria-describedby="resultCount" aria-controls="list">

<script>

/* ---------- real ledger data -> view model ---------- */
const sid=id=>id?id.slice(0,8):"–";

    const nxt=x.fixedBy&&byId[x.fixedBy.id]?{id:x.fixedBy.id,link:x.fixedBy.kind}:(x.replacedBy&&byId[x.replacedBy]?{id:x.replacedBy,link:"supersedes"}:null);

/* ---------- state ---------- */
const st={qIds:null,q:"",type:"",entity:"",bot:"",date:"",from:"",to:"",outcome:"",status:"",sort:"rank",sel:null,trail:[],open:false,tab:"decisions",actAgent:"",actKind:"",actLimit:40,oSort:"nOut",oDir:-1};

/* ---------- small marks ---------- */
function rankMark(x){

    h("b",{"aria-hidden":"true",text:one?"I":"II"}),

function highlight(text,q){

/* ---------- filters ---------- */

function applyFilters(){

/* ---------- tabs, theme, keyboard ---------- */
function setTab(t){
  st.tab=t; ["decisions","activity","outcomes"].forEach(k=>{ const on=k===t; const tb=$("#t-"+k); tb.setAttribute("aria-selected",on); tb.tabIndex=on?0:-1; $("#p-"+k).hidden=!on; });
  if(t==="activity") renderActivity(); if(t==="outcomes") renderOutcomes();
  if(typeof resize==="function") resize();
}
const themes=["auto","light","dark"];
function setTheme(t){ const r=document.documentElement; if(t==="auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme",t);
  $("#themeLabel").textContent=t[0].toUpperCase()+t.slice(1); $("#themeBtn").setAttribute("aria-label",`Theme: ${t==="auto"?"follows system":t}. Switch theme`); st.theme=t; }
function isTyping(e){ const t=e.target; return t&&(t.tagName==="INPUT"||t.tagName==="SELECT"||t.tagName==="TEXTAREA"); }
function moveSel(d){ if(!filtered.length) return; let i=filtered.findIndex(x=>x.id===st.sel); i=i<0?0:Math.min(filtered.length-1,Math.max(0,i+d)); select(filtered[i].id,{reset:true}); }
document.addEventListener("keydown",e=>{
  if((e.key==="k"||e.key==="K")&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); focusSearch(); return; }
  if(e.key==="/"&&!isTyping(e)){ e.preventDefault(); focusSearch(); return; }
  if(e.key==="Escape"){ if(st.open){ e.preventDefault(); closeDetail(); return; } if(e.target.id==="q"&&st.q){ e.target.value=""; st.q=""; runSearch(); return; } if(isTyping(e)) e.target.blur(); return; }
  if(st.tab!=="decisions") return;
  const inList=e.target.closest&&e.target.closest("#list"), inSearch=e.target.id==="q";
  if((inList||inSearch)&&(e.key==="ArrowDown"||e.key==="ArrowUp")){ e.preventDefault(); moveSel(e.key==="ArrowDown"?1:-1); if(inList){const r=document.querySelector(`.row[data-id="${st.sel}"]`); r&&r.focus();} return; }
  if(inList&&(e.key==="Home"||e.key==="End")){ e.preventDefault(); select((e.key==="Home"?filtered[0]:filtered[filtered.length-1]).id,{reset:true}); document.querySelector(`.row[data-id="${st.sel}"]`).focus(); return; }
  if(inSearch&&e.key==="Enter"){ e.preventDefault(); if(!st.sel&&filtered[0]) select(filtered[0].id,{reset:true}); openDetail(true); return; }
  if(e.altKey&&e.key==="ArrowLeft"){ e.preventDefault(); back(); }
});
