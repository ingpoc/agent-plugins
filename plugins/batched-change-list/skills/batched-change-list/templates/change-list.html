<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{color-scheme:light dark;--ink:#17212b;--muted:#5e6d7c;--line:#d9e1e8;--panel:#f5f8fa;--accent:#245a83;--green:#217b58;--red:#a52c20}
@media(prefers-color-scheme:dark){:root{--ink:#e5edf3;--muted:#a7b4c0;--line:#384552;--panel:#1a242d;--accent:#8ecaff;--green:#71d9ad;--red:#ffaaa0}}
*{box-sizing:border-box}body{margin:0;background:Canvas;color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif}
a{color:var(--accent)}a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.skip{position:absolute;left:-9999px}.skip:focus{left:1rem;top:1rem;background:var(--panel);z-index:2}
nav{padding:16px;border-bottom:1px solid var(--line)}nav h2{font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}nav ul{display:flex;gap:6px;overflow:auto;list-style:none;margin:0;padding:0}nav a{display:block;white-space:nowrap;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);text-decoration:none}nav a[aria-current=page]{border-color:var(--accent);color:var(--accent);font-weight:700}.source{display:block;color:var(--muted);font-size:.75rem;font-weight:400}.fixed{display:inline-block;border:1px solid var(--green);color:var(--green);border-radius:99px;padding:1px 7px;font-size:.72rem;margin-left:6px}
.check-badge{display:block;font-size:.75rem;font-weight:600;color:var(--muted);margin-top:4px}.check-badge.checking{color:var(--accent)}.check-badge.not_fixed{color:var(--red)}.check-badge.fixed-check{color:var(--green)}.spinner{display:inline-block;width:.8em;height:.8em;margin-right:.4em;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none;border-right-color:currentColor}}
main{max-width:1080px;padding:24px 16px 48px;margin:0 auto;width:100%;min-width:0}h1{font-size:clamp(1.8rem,4vw,2.5rem);line-height:1.1;margin:0 0 12px}.tracking{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:8px;margin:0 0 18px}.tracking-item{display:flex;flex-direction:column;gap:1px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);text-decoration:none;overflow-wrap:anywhere}.tracking-item strong{font-size:.92rem}.tracking-label{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.counts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}.counts span,.status{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 9px;font-size:.8rem}.issue{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.issue h2{font-size:1.15rem;margin:10px 0}.result-summary{border-left:3px solid var(--accent);padding:8px 12px;background:color-mix(in srgb,var(--accent) 8%,transparent)}figure{margin:14px 0}figure img{display:block;max-width:100%;height:auto;border-radius:6px}figcaption{font-size:.8rem;color:var(--muted)}details{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}summary{cursor:pointer;color:var(--accent);font-weight:650}dl{display:grid;grid-template-columns:minmax(90px,130px) 1fr;gap:6px 12px}dt{font-weight:650}dd{margin:0;overflow-wrap:anywhere}[hidden]{display:none!important}
.evidence-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px;margin-top:14px}.evidence-gallery figure{min-width:0;margin:0;padding:8px;border:1px solid var(--line);border-radius:9px;background:color-mix(in srgb,var(--panel) 80%,transparent)}

/* Review workspace */
:root{color-scheme:light;--ink:#202921;--muted:#637066;--line:#dfe5db;--panel:#fff;--accent:#315b49;--green:#236b4c;--red:#a64037}
body{background:#f4f5ef;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.01em}
a:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #9bbca8;outline-offset:3px}
.workspace{width:100%;max-width:1500px;margin:auto;padding:32px clamp(18px,3vw,48px) 64px}
.masthead{display:flex;align-items:start;justify-content:space-between;gap:24px;margin:0 0 25px}.eyebrow{font-size:.72rem;font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:#63816d;margin:0 0 10px}.masthead h1{font-size:clamp(2rem,3.6vw,3.4rem);letter-spacing:-.055em;line-height:1.04;font-weight:650;max-width:900px;margin:0}.masthead p.subhead{margin:10px 0 0;color:var(--muted);font-size:.94rem}
.tracking{margin:0 0 24px;gap:10px}.tracking-item{background:#e9eee6;border:0;border-radius:14px;padding:12px 15px}.tracking-label{letter-spacing:.09em}.tracking-item strong{font-weight:650}
.overview{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 20px;margin:0 0 24px}.counts{margin:0;gap:7px}.counts span{border:0;background:#e5ebe1;color:#465d4c;padding:7px 11px;font-size:.76rem;font-weight:650}.overview #verification-progress{margin:0;color:var(--muted);font-size:.78rem}
.layout{display:grid;grid-template-columns:minmax(250px,340px) minmax(0,1fr);gap:18px;align-items:start}
nav{background:#fff;border:1px solid var(--line);border-radius:18px;padding:19px;position:sticky;top:18px;min-width:0}nav h2{font-size:.75rem;letter-spacing:.1em;margin:0 0 14px}.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#f7f9f5;color:var(--ink);font:inherit;margin:0 0 12px}nav ul{display:flex;flex-direction:column;gap:5px;overflow:auto;max-height:65vh}nav a{white-space:normal;line-height:1.3;border:1px solid transparent;background:transparent;border-radius:10px;padding:11px 12px;font-weight:600}nav a:hover{background:#f3f6f0}nav a[aria-current=page]{background:#e8f0e8;border-color:#b9cebc;color:#234e39}.source{margin-top:5px}.check-badge{margin-top:5px}
main{max-width:none;padding:0;margin:0}.issue{background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(24px,4vw,44px);box-shadow:0 14px 42px rgba(33,52,37,.04)}.issue h2{font-size:clamp(1.6rem,2.8vw,2.6rem);font-weight:650;letter-spacing:-.045em;line-height:1.14;margin:18px 0}.issue>p{color:#4b5b50;line-height:1.7;max-width:78ch}.issue-id{font-size:.75rem;font-weight:750;letter-spacing:.1em;color:#718375;margin-bottom:12px}.status{background:#eaf1e9;border:0;color:#365c43;padding:6px 11px;font-weight:700}.result-summary{border:0;border-radius:12px;padding:19px 21px;background:#f0f5ed;margin:25px 0;color:#2f4f39}.result-summary strong{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase}.result-summary p{margin:7px 0 0;line-height:1.65}.issue details{margin-top:28px;padding-top:20px}.issue summary{font-weight:650}.issue dl{overflow-wrap:anywhere}.empty-search{color:var(--muted);font-size:.85rem;padding:12px}
/* Compact review view: keep primary evidence near the top. */
.workspace{padding-top:18px;padding-bottom:32px}.masthead{margin-bottom:14px}.masthead h1{font-size:clamp(1.55rem,2.1vw,2rem);letter-spacing:-.035em}.eyebrow{margin-bottom:5px}.masthead p.subhead{margin-top:5px;font-size:.85rem}.tracking{margin-bottom:13px}.tracking-item{padding:8px 12px}.tracking-item strong{font-size:.82rem}.plugin-versions{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:.76rem}.plugin-versions span{white-space:nowrap}.plugin-versions strong{font-size:inherit}.tracking-item .plugin-versions+.tracking-label,.tracking-item .tracking-label:not(:first-child){margin-top:6px}.overview{margin-bottom:13px}.counts span{padding:4px 9px}.layout{gap:12px;grid-template-columns:minmax(235px,300px) minmax(0,1fr)}nav{padding:14px;top:12px}nav h2{margin-bottom:9px}.search{padding:8px 10px;margin-bottom:8px}nav ul{gap:2px}nav a{padding:8px 10px;font-size:.86rem}.source,.check-badge{margin-top:2px}.issue{padding:clamp(20px,2.4vw,28px)}.issue-id{margin-bottom:7px}.issue h2{font-size:clamp(1.3rem,1.8vw,1.7rem);letter-spacing:-.03em;margin:10px 0}.issue>p{line-height:1.5;margin:10px 0}.result-summary{padding:12px 15px;margin:14px 0}.result-summary p{line-height:1.5}.issue details{margin-top:16px;padding-top:12px}.issue details details{margin:9px 0;padding:8px 0 0}.evidence-timeline{list-style:none;margin:12px 0;padding:0}.evidence-version{display:grid;grid-template-columns:78px 20px minmax(0,1fr);gap:8px;font-size:.85rem}.evidence-version>strong{text-align:right;color:var(--muted);font-size:.78rem;padding-top:3px}.evidence-dot{position:relative;border-left:2px solid #cad8ca;margin-left:8px}.evidence-dot::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;background:#45905e;border:2px solid white;border-radius:50%;box-shadow:0 0 0 3px #e0efe3}.issue .evidence-version details{margin:0;padding:0 0 14px;border:0}.evidence-version summary{color:var(--ink);font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.evidence-version details[open] summary{display:block}.evidence-meta{font-size:.75rem;color:var(--muted);overflow-wrap:anywhere}
.header-build{flex:0 1 460px;min-width:260px}.header-build:empty{display:none}.header-build .tracking-item{padding:8px 12px}.workflow{margin:0 0 12px;padding:9px 12px;background:#fff;border:1px solid var(--line);border-radius:12px}.workflow-heading{display:flex;justify-content:space-between;gap:8px;font-size:.72rem;color:var(--muted)}.workflow-heading strong{color:var(--ink)}.workflow ol{display:flex;overflow-x:auto;list-style:none;padding:5px 2px 7px;margin:4px 0 0}.workflow-step{display:flex;align-items:center;gap:7px;white-space:nowrap;color:var(--muted);font-size:.75rem}.workflow-step:not(:last-child)::after{content:"";display:block;width:clamp(18px,3vw,42px);height:1px;background:#cad8ca;margin:0 9px}.workflow-step span{display:block;flex:none;width:10px;height:10px;border-radius:50%;background:#9bad9f;box-shadow:0 0 0 3px #edf3ed;font-size:0}.workflow-step.active{color:#164d2b;font-weight:700}.workflow-step.active span{background:#218447;box-shadow:0 0 0 4px #d4eedb,0 0 12px 3px #71c990}.workflow-step.active{border-radius:0}.tracking-item .inventory-note{font-size:.72rem;color:var(--muted);margin-top:4px}.tracking-item .build-details{margin:4px 0 0;padding:0;border:0;font-size:.72rem}.build-details summary{font-weight:600}.build-details p{margin:5px 0;overflow-wrap:anywhere}
@media(max-width:760px){.workspace{padding:22px 16px 48px}.masthead{display:block}.header-build{margin-top:12px;min-width:0}.layout{grid-template-columns:1fr}nav{position:static;padding:15px}nav ul{max-height:220px}.issue{padding:20px}.tracking{grid-template-columns:1fr}.overview{align-items:flex-start}.issue h2{font-size:1.35rem}}

</style>
</head>
<body>
<a class="skip" href="#issue">Skip to selected issue</a>
<div class="workspace"><header class="masthead"><div><p class="eyebrow">Issue review</p><h1>{{TITLE}}</h1><p class="subhead">Select an issue to review its status and evidence.</p></div><div class="header-build">{{BUILD_CARD}}</div></header>{{TRACKING}}{{TIMELINE}}<div class="overview"><div class="counts" id="counts" aria-label="Issue counts"></div><p id="verification-progress" role="status"></p></div><div class="layout"><nav aria-label="Tracked issues"><h2>Tracked issues</h2><label for="issue-search" class="skip">Search issues</label><input class="search" id="issue-search" type="search" placeholder="Search issues" autocomplete="off"><ul id="navigation"></ul><p class="empty-search" id="empty-search" hidden>No matching issues.</p></nav><main><p id="selection-filtered" class="empty-search" hidden>Selected issue is outside the search results.</p><section id="issue" aria-live="polite"></section></main></div></div>
<script type="application/json" id="findings-data">{{FINDINGS_JSON}}</script>
<script type="application/json" id="run-data">{{RUN_JSON}}</script>
<script>
const findings=JSON.parse(document.getElementById('findings-data').textContent).sort((a,b)=>Number(b.check?.state==='checking')-Number(a.check?.state==='checking')||Number(b.status==='in_progress')-Number(a.status==='in_progress')||Number(a.status==='verified_fixed')-Number(b.status==='verified_fixed'));
const run=JSON.parse(document.getElementById('run-data').textContent);
const nav=document.getElementById('navigation'),panel=document.getElementById('issue'),counts=document.getElementById('counts');
const node=(tag,text,cls)=>{const el=document.createElement(tag);if(text)el.textContent=text;if(cls)el.className=cls;return el};
const labels={'verified_fixed':'Verified fixed','failing':'Failing','untested':'Untested','in_progress':'In progress','awaiting_user_test':'Awaiting user test','awaiting_verification':'Awaiting verification','blocked':'Blocked','investigation':'Investigation needed'};
if(findings.length){for(const [status,label] of Object.entries(labels)){const count=findings.filter(item=>item.status===status).length;if(count)counts.append(node('span',`${count} ${label.toLowerCase()}`))}}
else counts.append(node('span','0 tracked issues'));
const search=document.getElementById('issue-search');
const checkLabels={pending:'Not checked this install',checking:'Checking this install',fixed:'Checked this install',not_fixed:'Not fixed',blocked:'Blocked',inconclusive:'Inconclusive'};
function latestResult(item){const states={fixed:'Fixed',not_fixed:'Not fixed',blocked:'Blocked',inconclusive:'Inconclusive'};const check=item.check;if(check&&states[check.state]&&check.evidence)return {label:`Latest check · ${states[check.state]}`,reason:check.evidence};const prior=(item.version_timeline||[]).find(record=>states[record.state])||(item.version_timeline||[])[0];if(prior)return {label:`Previous ${prior.state?'check · '+states[prior.state]:'observation'} · ${prior.version}`,reason:prior.outcome};return {label:'No completed check',reason:'No verification result has been recorded yet.'}}
function markStale(element,check){if(check?.state!=='checking')return;const last=Date.parse(check.updated_at||check.started_at);if(!Number.isFinite(last))return;const stale=()=>{element.textContent='Check status stale · last update over 5 min ago';element.classList.remove('checking')};const remaining=300000-(Date.now()-last);if(remaining<=0)stale();else setTimeout(stale,remaining)}
if(run){const done=findings.filter(item=>['fixed','not_fixed'].includes(item.check?.state)).length;const pending=findings.filter(item=>item.check?.state==='pending').length;const blocked=findings.filter(item=>['blocked','inconclusive'].includes(item.check?.state)).length;const checking=findings.filter(item=>item.check?.state==='checking').length;document.getElementById('verification-progress').textContent=`Checked ${done} of ${findings.length} · ${checking} checking · ${pending} not checked · ${blocked} blocked or inconclusive`}
for(const item of findings){const li=node('li'),a=node('a',item.title);a.href='#'+encodeURIComponent(item.id);a.append(node('span',item.source,'source'));if(item.status==='verified_fixed')a.append(node('span','Fixed','fixed'));const working=item.status==='in_progress';if(working){const w=node('span',null,'check-badge checking working');const sp=node('span',null,'spinner');sp.setAttribute('aria-hidden','true');w.append(sp,document.createTextNode('Working on it'));a.append(w)}if(!working&&run&&item.check){const state=item.check.state;const badge=node('span',null,`check-badge ${state==='fixed'?'fixed-check':state}`);if(state==='checking'){const spinner=node('span',null,'spinner');spinner.setAttribute('aria-hidden','true');badge.append(spinner)}badge.append(document.createTextNode(checkLabels[state]));markStale(badge,item.check);a.append(badge)}li.append(a);nav.append(li)}
function show(){
 const selected=findings.find(item=>'#'+encodeURIComponent(item.id)===location.hash)||findings[0];if(!selected){panel.replaceChildren(node('p','No tracked issues.'));return}
 for(const link of nav.querySelectorAll('a')){if(link.hash==='#'+encodeURIComponent(selected.id))link.setAttribute('aria-current','page');else link.removeAttribute('aria-current')}
 const article=node('article',null,'issue');article.append(node('div',selected.id,'issue-id'),node('span',labels[selected.status],'status'),node('h2',selected.title));if(run&&selected.check){const progress=node('p',null,`check-badge ${selected.check.state}`);if(selected.check.state==='checking'){const spinner=node('span',null,'spinner');spinner.setAttribute('aria-hidden','true');progress.append(spinner)}progress.append(document.createTextNode(checkLabels[selected.check.state]));markStale(progress,selected.check);article.append(progress)}
 if(selected.observed)article.append(node('p',selected.observed));
 const result=latestResult(selected),summary=node('div',null,'result-summary');summary.append(node('strong',result.label),node('p',result.reason));article.append(summary);
 const shots=selected.evidence||[];if(shots.length){const gallery=node('div',null,'evidence-gallery');gallery.setAttribute('aria-label','Screenshot evidence');for(const shot of shots){const figure=node('figure'),img=node('img');img.src=shot.src;img.alt=shot.alt;figure.append(img,node('figcaption',shot.caption));if(shot.full){const link=node('a','View full evidence');link.href=shot.full;figure.append(link)}gallery.append(figure)}article.append(gallery)}
 const detail=node('details',null,'agent-details');detail.append(node('summary','Agent details'));const values=selected.details||{};
 const notes=Object.entries(values).filter(([key,value])=>value&&!(key==='Current installation check'&&value===selected.check?.evidence));if(notes.length){const history=node('details');history.append(node('summary',`Additional details (${notes.length})`));const dl=node('dl');for(const [key,value] of notes)dl.append(node('dt',key),node('dd',value));history.append(dl);detail.append(history)}
 const records=selected.version_timeline||[];if(records.length){const history=node('section');history.append(node('h3','Verification by version'));const timeline=node('ol',null,'evidence-timeline');for(const record of records){const row=node('li',null,'evidence-version'),entry=node('details');const label=record.state?({fixed:'Fixed',not_fixed:'Not fixed',blocked:'Blocked',inconclusive:'Inconclusive'}[record.state]+': '):'';const summary=node('summary');if(label)summary.append(node('strong',label));summary.append(node('span',record.outcome));entry.append(summary,node('p',`${record.check} · ${record.timestamp} · ${record.build}`,'evidence-meta'));row.append(node('strong',record.version),node('span',null,'evidence-dot'),entry);timeline.append(row)}history.append(timeline);article.append(history)}
 article.append(detail);panel.replaceChildren(article)
}
search.addEventListener('input',event=>{const q=event.target.value.trim().toLowerCase();let visible=0;for(const li of nav.children){const match=li.textContent.toLowerCase().includes(q)||li.firstChild.hash.toLowerCase().includes(q);li.hidden=!match;if(match)visible++}document.getElementById('empty-search').hidden=visible>0;const selected=nav.querySelector('a[aria-current=page]');document.getElementById('selection-filtered').hidden=!selected?.parentElement.hidden});
window.addEventListener('hashchange',()=>{show();search.dispatchEvent(new Event('input'))});show();
try{const saved=JSON.parse(sessionStorage.getItem('change-list-view')||'null');sessionStorage.removeItem('change-list-view');if(saved){search.value=saved.query||'';search.dispatchEvent(new Event('input'));const detail=panel.querySelector('.agent-details');if(detail)detail.open=!!saved.details;if(saved.focus==='search'){search.focus();search.setSelectionRange(saved.start,saved.end)}else if(saved.focus==='details')detail?.querySelector('summary')?.focus();window.scrollTo(saved.x||0,saved.y||0)}}catch{}
if(location.protocol==='http:'||location.protocol==='https:'){const original=document.getElementById('findings-data').textContent+'|'+document.getElementById('run-data').textContent+'|'+document.querySelector('.workflow').outerHTML;let signature=null,initialized=false,busy=false;const refresh=async()=>{if(document.hidden||busy)return;busy=true;try{const head=await fetch(location.href,{method:'HEAD',cache:'no-store'});const nextSignature=head.ok&&(head.headers.get('etag')||head.headers.get('last-modified'));if(!initialized||!nextSignature||nextSignature!==signature){const response=await fetch(location.href,{cache:'no-store'});if(!response.ok)return;const next=new DOMParser().parseFromString(await response.text(),'text/html');const data=next.getElementById('findings-data'),nextRun=next.getElementById('run-data');if(data&&nextRun&&data.textContent+'|'+nextRun.textContent+'|'+next.querySelector('.workflow')?.outerHTML!==original){try{const active=document.activeElement;sessionStorage.setItem('change-list-view',JSON.stringify({query:search.value,details:!!panel.querySelector('.agent-details')?.open,focus:active===search?'search':active===panel.querySelector('.agent-details summary')?'details':'',start:search.selectionStart,end:search.selectionEnd,x:window.scrollX,y:window.scrollY}))}catch{}location.reload();return}signature=nextSignature;initialized=true}}catch{}finally{busy=false}};refresh();setInterval(refresh,run?.status==='active'?1500:4000)}else if(run?.status==='active'){document.getElementById('verification-progress').append(' · Refresh this file to see updates')}
</script>
</body>
</html>
