n-box{display:grid;gap:3px;min-width:110px;max-width:230px;padding:7px 9px;border:1px solid #cad8ca;border-radius:6px;font-size:.68rem}.plan-box span,.plan-reason{overflow-wrap:anywhere;color:var(--muted)}.plan-box small,.plan-reason{font-size:.62rem;color:var(--muted)}.plan-merge{background:#edf3ed;justify-self:stretch;text-align:center}.plan-arrow{color:var(--muted)}.plan-reason{flex-basis:100%;margin-left:30px}.tracking-item .inventory-note{font-size:.72rem;color:var(--muted);margin-top:4px}.tracking-item .build-details{margin:4px 0 0;padding:0;border:0;font-size:.72rem}.build-details summary{font-weight:600}.build-details p{margin:5px 0;overflow-wrap:anywhere}

<body>
<a class="skip" href="#issue">Skip to selected issue</a>
<div class="workspace"><header class="masthead"><div><p class="eyebrow">Issue review</p><h1>{{TITLE}}</h1><p class="subhead">Select an issue to review its status and evidence.</p></div><div class="header-build">{{BUILD_CARD}}</div></header>{{TRACKING}}{{TIMELINE}}<div class="overview"><div class="counts" id="counts" aria-label="Issue counts"></div>{{VERIFICATION_PROGRESS}}</div><div class="layout"><nav aria-label="Tracked issues"><h2>Tracked issues</h2><label for="issue-search" class="skip">Search issues</label><input class="search" id="issue-search" type="search" placeholder="Search issues" autocomplete="off"><ul id="navigation"></ul><p class="empty-search" id="empty-search" hidden>No matching issues.</p></nav><main><p id="selection-filtered" class="empty-search" hidden>Selected issue is outside the search results.</p><section id="issue" aria-live="polite"></section></main></div></div>
<script type="application/json" id="findings-data">{{FINDINGS_JSON}}</script>
<script type="application/json" id="run-data">{{RUN_JSON}}</script>
<script>
const findings=JSON.parse(document.getElementById('findings-data').textContent).sort((a,b)=>Number(b.check?.state==='checking')-Number(a.check?.state==='checking')||Number(b.status==='in_progress')-Number(a.status==='in_progress')||Number(a.status==='verified_fixed')-Number(b.status==='verified_fixed'));
const run=JSON.parse(document.getElementById('run-data').textContent);const relativeTime=new Intl.RelativeTimeFormat(undefined,{numeric:'auto'}),localDate=new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'short'});function formatPageTimes(){const units=[['year',31536000],['month',2592000],['day',86400],['hour',3600],['minute',60],['second',1]];for(const time of document.querySelectorAll('time[data-relative]')){const date=new Date(time.dateTime);if(Number.isNaN(date.getTime()))continue;const delta=(Date.now()-date.getTime())/1000,unit=units.find(([,size])=>Math.abs(delta)>=size)||units[units.length-1];time.textContent=`${localDate.format(date)} (${relativeTime.format(-Math.round(delta/unit[1]),unit[0])})`}}formatPageTimes();setInterval(formatPageTimes,60000);
const nav=document.getElementById('navigation'),panel=document.getElementById('issue'),counts=document.getElementById('counts');
const node=(tag,text,cls)=>{const el=document.createElement(tag);if(text)el.textContent=text;if(cls)el.className=cls;return el};
const workflowLoop=document.querySelector('.workflow-loop'),workflowList=document.querySelector('.workflow ol');function positionWorkflowLoop(){if(!workflowLoop||!workflowList)return;const workflow=workflowLoop.closest('.workflow'),plan=workflowList.querySelector('[data-stage=plan_fix]'),gate=workflowList.querySelector('[data-stage=gate]');if(!workflow||!plan||!gate)return;const box=workflow.getBoundingClientRect(),list=workflowList.getBoundingClientRect(),x=el=>{const r=el.getBoundingClientRect();return r.left-list.left+workflowList.scrollLeft+r.width/2},start=x(gate),end=x(plan),width=workflowList.scrollWidth;workflowLoop.style.left=`${list.left-box.left-workflowList.scrollLeft}px`;workflowLoop.style.top=`${workflowList.offsetTop+workflowList.offsetHeight-29}px`;workflowLoop.style.width=`${width}px`;workflowLoop.setAttribute('viewBox',`0 0 ${width} 28`);workflowLoop.querySelector('.workflow-loop-path').setAttribute('d',`M${start} 0 C${start} 25 ${end} 25 ${end} 0`);workflowLoop.querySelector('.workflow-loop-label').setAttribute('x',(start+end)/2)}positionWorkflowLoop();workflowList?.addEventListener('scroll',positionWorkflowLoop);window.addEventListener('resize',positionWorkflowLoop);
const labels={'verified_fixed':'Verified fixed','failing':'Failing','untested':'Untested','in_progress':'In progress','awaiting_user_test':'Awaiting user test','awaiting_verification':'Awaiting verification','blocked':'Blocked','investigation':'Investigation needed'};
if(findings.length){for(const [status,label] of Object.entries(labels)){const count=findings.filter(item=>item.status===status).length;if(count)counts.append(node('span',`${count} ${label.toLowerCase()}`))}}
else counts.append(node('span','0 tracked issues'));
const search=document.getElementById('issue-search');
const checkLabels={pending:'Not checked this install',checking:'Checking this install',fixed:'Checked this install',not_fixed:'Not fixed',blocked:'Blocked',inconclusive:'Inconclusive'};
function markStale(element,check){if(check?.state!=='checking')return;const last=Date.parse(check.updated_at||check.started_at);if(!Number.isFinite(last))return;const stale=()=>{element.textContent='Check status stale · last update over 5 min ago';element.classList.remove('checking')};const remaining=300000-(Date.now()-last);if(remaining<=0)stale();else setTimeout(stale,remaining)}
if(run?.status==='active'){const done=findings.filter(item=>['fixed','not_fixed'].includes(item.check?.state)).length;const pending=findings.filter(item=>item.check?.state==='pending').length;const blocked=findings.filter(item=>['blocked','inconclusive'].includes(item.check?.state)).length;const checking=findings.filter(item=>item.check?.state==='checking').length;document.getElementById('verification-progress').textContent=`Checked ${done} of ${findings.length} · ${checking} checking · ${pending} not checked · ${blocked} blocked or inconclusive`}
for(const item of findings){const li=node('li'),a=node('a');a.append(node('span',item.id,'nav-id'),node('span',item.title,'nav-title'));a.href='#'+encodeURIComponent(item.id);a.append(node('span',item.source,'source'));if(item.status==='verified_fixed')a.append(node('span','Fixed','fixed'));const working=item.status==='in_progress';if(working){const w=node('span',null,'check-badge checking working');const sp=node('span',null,'spinner');sp.setAttribute('aria-hidden','true');w.append(sp,document.createTextNode('Working on it'));a.append(w)}if(!working&&run?.status==='active'&&item.check){const state=item.check.state;const badge=node('span',null,`check-badge ${state==='fixed'?'fixed-check':state}`);if(state==='checking'){const spinner=node('span',null,'spinner');spinner.setAttribute('aria-hidden','true');badge.append(spinner)}badge.append(document.createTextNode(checkLabels[state]));markStale(badge,item.check);a.append(badge)}li.append(a);nav.append(li)}
function show(){
 const selected=findings.find(item=>'#'+encodeURIComponent(item.id)===location.hash)||findings[0];if(!selected){panel.replaceChildren(node('p','No tracked issues.'));return}
 for(const link of nav.querySelectorAll('a')){if(link.hash==='#'+encodeURIComponent(selected.id))link.setAttribute('aria-current','page');else link.removeAttribute('aria-current')}
 const article=node('article',null,'issue'),heading=node('div',null,'issue-heading'),working=selected.status==='in_progress',status=node('span',working?'Working on it':labels[selected.status],`status status-${selected.status==='failing'?'failing':working?'in_progress':selected.status==='untested'?'untested':selected.status==='verified_fixed'?'verified_fixed':'other'}`);heading.append(node('div',selected.id,'issue-id'),status);article.dataset.findingId=selected.id;article.dataset.status=selected.status;article.append(heading,node('h2',selected.title));
 if(run?.status==='active'&&selected.check){const progress=node('p',null,`check-badge ${selected.check.state}`);if(selected.check.state==='checking'){const spinner=node('span',null,'spinner');spinner.setAttribute('aria-hidden','true');progress.append(spinner)}progress.append(document.createTextNode(checkLabels[selected.check.state]));markStale(progress,selected.check);article.append(progress)}const part=(label,value,cls='')=>{if(!value?.trim())return;const section=node('section',null,`issue-part ${cls}`);section.append(node('h3',label),node('p',value));article.append(section)};part("What's wrong",selected.summary);part('Why it matters',selected.impact);part('Done when',selected.done_when);const records=selected.version_timeline||[];if(records.length){const history=node('section',null,'issue-part version-history');history.append(node('h3','Verification by version'));const timeline=node('ol',null,'version-timeline');const stateChip={fixed:['Fixed','verified_fixed'],not_fixed:['Failing','failing'],blocked:['Blocked','untested'],inconclusive:['Inconclusive','untested']};const ist=t=>{const d=new Date(t);return isNaN(d)?t:d.toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',hour12:false})+' IST'};for(const record of records){const row=node('li',null,'version-row'),[chipText,chipCls]=stateChip[record.state]||['Checked','other'],line=node('p',record.outcome,'version-summary');line.title=record.outcome;line.tabIndex=0;line.addEventListener('click',()=>line.classList.toggle('expanded'));const body=node('div',null,'version-body');body.append(line,node('p',`Installed ${ist(record.timestamp)} · ${record.build}`,'version-meta'));row.append(node('span',record.version,'version-chip'),node('span',chipText,`status status-${chipCls} version-status`),body);timeline.append(row)}history.append(timeline);article.append(history)}
 const shots=selected.evidence||[];if(shots.length){const gallery=node('div',null,'evidence-gallery');gallery.setAttribute('aria-label','Screenshot evidence');for(const shot of shots){const figure=node('figure'),img=node('img');img.src=shot.src;img.alt=shot.alt;figure.append(img,node('figcaption',shot.caption));if(shot.full){const link=node('a','View full evidence');link.href=shot.full;figure.append(link)}gallery.append(figure)}article.append(gallery)}
 const found=selected.issues||[];if(found.length){const list=node('section',null,'issue-part issues-found');list.append(node('h3','Issues found'));const ol=node('ol',null,'evidence-timeline');for(const issue of found){const row=node('li',null,issue.outcome==='fixed'?'issue-row':'issue-row next'),body=node('div');const line=node('p');line.append(node('strong',issue.outcome==='fixed'?'Fixed: ':'Next cycle: '),node('span',issue.issue));body.append(line,node('p','Evidence: '+issue.evidence,'evidence-meta'));row.append(node('span',null,'evidence-dot'),body);ol.append(row)}list.append(ol);article.append(list)}
 const evidenceRows=[];if(selected.recommendation?.trim())evidenceRows.push(['Suggested fix · where to look',selected.recommendation]);if(selected.evidence_text)evidenceRows.push(['Observed',selected.evidence_text]);const values=selected.details||{};for(const [key,value] of Object.entries(values)){if(key==='Current installation check'&&value===selected.check?.evidence)continue;evidenceRows.push([key,value])}if(selected.check?.evidence&&values['Current installation check']!==selected.check.evidence)evidenceRows.push(['Current installation check',selected.check.evidence]);const evidenceCount=evidenceRows.length;
 const detail=node('details',null,'evidence');detail.append(node('summary',`Evidence (${evidenceCount} ${evidenceCount===1?'row':'rows'})`));for(const [label,value] of evidenceRows){const row=node('section',null,'evidence-row');row.append(node('div',label,'evidence-label'),node('pre',value,'evidence-value'));detail.append(row)}
 article.append(detail);panel.replaceChildren(article)
}
search.addEventListener('input',event=>{const q=event.target.value.trim().toLowerCase();let visible=0;for(const li of nav.children){const match=li.textContent.toLowerCase().includes(q)||li.firstChild.hash.toLowerCase().includes(q);li.hidden=!match;if(match)visible++}document.getElementById('empty-search').hidden=visible>0;const selected=nav.querySelector('a[aria-current=page]');document.getElementById('selection-filtered').hidden=!selected?.parentElement.hidden});
window.addEventListener('hashchange',()=>{show();search.dispatchEvent(new Event('input'))});show();
try{const saved=JSON.parse(sessionStorage.getItem('change-list-view')||'null');sessionStorage.removeItem('change-list-view');if(saved){search.value=saved.query||'';search.dispatchEvent(new Event('input'));const detail=panel.querySelector('.evidence');if(detail)detail.open=!!saved.details;if(saved.focus==='search'){search.focus();search.setSelectionRange(saved.start,saved.end)}else if(saved.focus==='details')detail?.querySelector('summary')?.focus();window.scrollTo(saved.x||0,saved.y||0)}}catch{}
const saveView=()=>{try{const selected=nav.querySelector('a[aria-current=page]');if(selected&&!location.hash)history.replaceState(null,'',selected.hash);const active=document.activeElement;sessionStorage.setItem('change-list-view',JSON.stringify({query:search.value,details:!!panel.querySelector('.evidence')?.open,focus:active===search?'search':active===panel.querySelector('.evidence summary')?'details':'',start:search.selectionStart,end:search.selectionEnd,x:window.scrollX,y:window.scrollY}))}catch{}};
if(location.protocol==='http:'||location.protocol==='https:'){let fingerprint=null,busy=false;const refresh=async()=>{if(document.hidden||busy)return;busy=true;try{const response=await fetch(location.href,{method:'HEAD',cache:'no-store'});const next=response.ok&&(response.headers.get('etag')||response.headers.get('last-modified'));if(next&&fingerprint!==null&&next!==fingerprint){fingerprint=next;saveView();location.reload();return}if(next)fingerprint=next}catch{}finally{busy=false}};refresh();setInterval(refresh,5000)}else if(run?.status==='active'){document.getElementById('verification-progress').append(' · Refresh this file to see updates')}
</script>
