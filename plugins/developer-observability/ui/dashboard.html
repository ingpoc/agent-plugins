<!doctype html>
<html lang="en"><head><!--DEVOBS_VIEWER--><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Developer observability</title>
<style>
[hidden]{display:none!important}
:root{--bg:#fafaf8;--card:#fff;--ink:#1f2326;--mute:#61686c;--faint:#8d9397;--line:#e7e7e2;--acc:#25684c;--run:#2457a6;--warn:#9a5b00;--bad:#b3261e;--grey:#cfd2ce;--scale:1;font-size:calc(16px*var(--scale));color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 Geist,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--run);outline-offset:2px}
.mono{font-family:"Geist Mono",ui-monospace,monospace;font-size:.9375rem}
.wrap{max-width:880px;margin:auto;padding:0 32px}
.scope{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.scope .wrap{min-height:60px;height:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 0}
.seg{border:1px solid transparent;background:none;border-radius:8px;padding:5px 9px;font-size:1rem;white-space:nowrap}
.seg:hover,.seg[aria-expanded=true]{background:#fff;border-color:var(--line)}
.seg .count{color:var(--faint);margin-left:4px}
.sep{color:var(--faint)}
.sp{flex:1;min-width:8px}
.ts{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}
.ts button{border:0;background:none;padding:5px 11px;font-size:.9375rem}
.popover{position:absolute;top:54px;left:max(16px,calc((100vw - 880px)/2 + 32px));z-index:7;width:min(390px,calc(100vw - 32px));padding:16px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 36px #1f232614}
.popover[hidden]{display:none}
.popover h3{margin:0 0 10px;font-size:1rem}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices button,.chip{border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px 10px;min-height:40px;font-size:.9375rem}
.choices button[aria-current=true],.chip[aria-current=true]{border-color:var(--run);color:var(--run)}
.chip .meta{display:block;color:var(--mute);font-size:.8125rem}
.custom{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;min-width:0}
.custom label{display:grid;gap:4px;color:var(--mute);font-size:.9375rem}
.custom input[type=text]{border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px 10px;min-height:40px;font-variant-numeric:tabular-nums;min-width:0;width:100%;box-sizing:border-box}
.snap{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.hist{position:relative;display:flex;align-items:end;gap:2px;height:64px;margin:12px 0 8px;border-bottom:1px solid var(--line);touch-action:none;user-select:none;width:100%;overflow:hidden}
.hist i{flex:1;min-width:3px;display:block;background:#2457a6;border-radius:2px 2px 0 0;pointer-events:none}
.hist i.dim{opacity:.28}
.hist .brush{position:absolute;inset:0 auto 0 auto;background:#2457a61a;border-left:2px solid var(--run);border-right:2px solid var(--run);pointer-events:none}
.range{display:flex;gap:8px}
.range input{width:50%;accent-color:var(--run)}
main{max-width:880px;margin:0 auto;padding:0 32px 72px}
.headline{margin:56px 0 0;font-size:1.75rem;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.headline .d{color:var(--faint);font-weight:400;margin:0 5px}
.headline .bad{color:var(--bad)}
.sbar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:22px 0 0;background:#f0f1ed}
.sbar span{height:100%}
.legend{display:flex;gap:16px;margin:8px 0 0;color:var(--mute);font-size:.9375rem;flex-wrap:wrap}
.legend span{white-space:nowrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.section-title{font-size:.9375rem;font-weight:600;color:var(--mute);margin:42px 0 10px;letter-spacing:.01em}
.list{border-top:1px solid var(--line)}
.need{display:flex;align-items:center;gap:16px;padding:14px 4px;border-bottom:1px solid var(--line)}
.need .id{min-width:170px}
.need .what{flex:1}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:10px;vertical-align:1px}
.act{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:6px 14px;font-size:.9375rem;min-height:40px}
.grp{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:16px 4px;text-align:left;font-size:1.0625rem}
.grp:hover,.row:hover{background:#fff}
.grp .n{color:var(--mute);font-variant-numeric:tabular-nums}
.grp .chev{margin-left:auto;color:var(--faint);transition:transform .15s}
.grp[aria-expanded=true] .chev{transform:rotate(90deg)}
.rows{border-bottom:1px solid var(--line);padding:2px 0 8px}
.row{display:grid;grid-template-columns:200px 1fr auto;gap:16px;align-items:baseline;width:100%;border:0;background:none;text-align:left;padding:10px 4px 10px 22px;border-radius:6px}
.row .title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .origin{margin-left:8px}
.row .e{font-size:.9375rem;white-space:nowrap;text-align:right}
.pass{color:var(--acc)}.fail{color:var(--bad)}.run{color:var(--run)}.muted{color:var(--faint)}
.more{border:0;background:none;color:var(--run);padding:8px 22px;font-size:.9375rem}
.scrim{position:fixed;inset:0;background:#1f23262e;z-index:8}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:#fff;border-left:1px solid var(--line);z-index:9;overflow:auto;padding:24px 28px 40px;box-shadow:-12px 0 32px #0000000f}
.drawer .x{position:absolute;right:18px;top:18px;border:1px solid var(--line);background:#fff;border-radius:8px;width:40px;height:40px}
.drawer h2{margin:4px 40px 4px 0;font-size:1.25rem;line-height:1.3}
.facts{display:grid;grid-template-columns:110px 1fr;gap:8px 14px;margin:18px 0 0;font-size:.9375rem}
.facts dt{color:var(--mute)}.facts dd{margin:0}
.drawer h3{font-size:.9375rem;color:var(--mute);font-weight:600;margin:28px 0 8px}
.tl{list-style:none;margin:0;padding:0;border-inline-start:1px solid var(--line)}
.tl li{display:grid;grid-template-columns:102px 1fr;gap:10px;padding:0 0 14px 14px;position:relative}
.tl li:before{content:"";position:absolute;width:8px;height:8px;border-radius:50%;left:-5px;top:7px;background:var(--grey)}
.tl li.fail-dot:before{background:var(--bad)}
.tl li.pass-dot:before{background:var(--acc)}
.tl li.inconclusive-dot:before{background:var(--faint)}
.e.inconclusive{color:var(--faint)}
.tl time{color:var(--mute);font-size:.9375rem}
.drawer details{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
.drawer summary{cursor:pointer}
.drawer pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.9375rem;color:var(--mute)}
.error{color:var(--bad);padding:24px 0}
.empty{padding:16px 4px;color:var(--faint)}
@media(max-width:480px){
.custom{grid-template-columns:1fr}
}
@media(max-width:600px){
.wrap,main{padding-left:18px;padding-right:18px}
.scope .wrap{gap:4px}
.headline{margin-top:36px;font-size:1.45rem}
.need{gap:8px;flex-wrap:wrap;align-items:flex-start}.need .id{min-width:0}.need .what{flex:1 1 100%;min-width:0;overflow-wrap:anywhere}
.row{grid-template-columns:100px 1fr;gap:8px}.row .e{grid-column:2;text-align:left}
.drawer{padding:22px 20px 32px}
}

/* v4 trail (SPEC-trail.md) */
.row{grid-template-columns:200px 1fr auto auto}
.cue{display:inline-flex;align-items:center;align-self:center;min-width:40px}
.drv{text-decoration:underline dotted;text-decoration-color:var(--faint);text-decoration-thickness:2px;text-underline-offset:4px}
.mis,.fn{color:var(--faint)}
.drawer h3.trh{display:flex;align-items:center;gap:10px}
.keyb{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:1px 10px;font-size:.9375rem;color:var(--mute);font-weight:500;min-height:32px}
.keyb[aria-expanded=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.key{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 12px;font-size:.9375rem;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}
.key .h{grid-column:1/-1;color:var(--mute);font-weight:600;margin-top:4px}
.tt{display:flex;gap:28px;margin:2px 0 6px;flex-wrap:wrap}
.tt .k{display:block;color:var(--mute);font-size:.9375rem}
.tt b{font-weight:600;font-size:1.125rem;font-variant-numeric:tabular-nums}
.tt small{font-size:.9375rem;font-weight:400;color:var(--faint)}
.trail{list-style:none;margin:6px 0 0;padding:0}
.st{display:grid;grid-template-columns:20px 1fr auto;column-gap:12px;padding:8px 0;position:relative}
.st::before{content:"";position:absolute;left:6px;top:24px;bottom:-8px;width:1.5px;background:var(--line)}
.trail li.st:last-child::before{display:none}
.mk{width:13px;height:13px;border-radius:50%;margin-top:5px;background:var(--ink);position:relative;z-index:1}
.mk.derived{background:#fff;border:2px solid var(--ink)}
.mk.missing{background:#fff;border:2px solid var(--faint)}
.mk.pending{background:#fff;border:2px dashed var(--grey)}
.st .sl{font-weight:500}
.st .sm{color:var(--mute);font-size:.9375rem;margin-top:1px;overflow-wrap:anywhere}
.st time{color:var(--ink);font-variant-numeric:tabular-nums;font-size:.9375rem;white-space:nowrap;padding-top:1px}
.st.pend .sl{color:var(--faint);font-weight:400}
.gapl{padding:0 0 0 32px;color:var(--mute);font-size:.9375rem;font-variant-numeric:tabular-nums;margin:-2px 0 2px;list-style:none}
.evl{color:var(--run)}
.tl li>span{min-width:0;overflow-wrap:anywhere}
.drawer details.cyc,.drawer details.jd,.drawer details.wk{margin-top:18px}
.drawer details.cyc summary,.drawer details.jd summary,.drawer details.wk summary{font-size:.9375rem;color:var(--mute);font-weight:600}
.jt{display:grid;grid-template-columns:1fr auto auto;gap:0 16px;margin-top:8px;font-size:.9375rem}
.jt>*{padding:8px 0;border-top:1px solid var(--line)}
.jt .hd{color:var(--mute);border-top:0;padding-bottom:4px}
.jt .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.jsum{color:var(--mute);font-size:.9375rem;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.stats{border-bottom:1px solid var(--line);padding:6px 4px 16px 22px;font-size:.9375rem}
.stg{display:grid;grid-template-columns:1.1fr 1fr 1fr 1.3fr;gap:0 16px}
.stg>*{padding:9px 0;border-top:1px solid var(--line)}
.stg .hd{color:var(--mute);border-top:0}
.stg .num{font-variant-numeric:tabular-nums}
@media(max-width:600px){
.row{grid-template-columns:auto 1fr auto;row-gap:2px}.row .mono{grid-column:1;grid-row:1}.row .cue{grid-column:2;grid-row:1;justify-self:start}.row .e{grid-column:3;grid-row:1;text-align:right}.row .title{grid-column:1/-1;grid-row:2;white-space:normal;overflow:visible;overflow-wrap:anywhere}
.need .act{order:2;margin-left:auto}.need .what{order:3}
.stats{padding-left:4px}.stg{grid-template-columns:1fr 1fr 1fr}.stg .hd:first-child{display:none}.stg .sc{grid-column:1/-1;font-weight:500;padding-bottom:0}.stg .sc+span,.stg .sc+span+span,.stg .sc+span+span+span{border-top:0;padding-top:2px}
.tt{gap:20px}
}
</style></head>
<body><!--DEVOBS_VIEWER-->
<nav class="scope"><div class="wrap">
<button class="seg" id="project" aria-expanded="false" aria-haspopup="listbox" aria-controls="project-pop"><span id="project-label">Agent Plugins</span></button>
<span class="sep">›</span>
<button class="seg" id="pr" aria-expanded="false" aria-haspopup="listbox" aria-controls="pr-pop"><span id="pr-label">#121</span></button>
<span class="sep">›</span>
<button class="seg" id="round" aria-expanded="false" aria-haspopup="listbox" aria-controls="round-pop"><span id="round-label">R2</span></button>
<button class="seg" id="time" aria-expanded="false" aria-haspopup="dialog" aria-controls="time-pop">🕒 <span id="time-label">Now</span></button>
<span class="sp"></span>
<div class="ts"><button id="smaller" aria-label="Decrease text size" title="Decrease text size">A−</button><button id="larger" aria-label="Increase text size" title="Increase text size">A+</button></div>
</div></nav>
<section class="popover" id="project-pop" hidden><h3>Project</h3><div class="choices" id="project-choices"></div></section>
<section class="popover" id="pr-pop" hidden><h3>Pull request</h3><div class="choices" id="pr-choices"></div></section>
<section class="popover" id="round-pop" hidden><h3>Round lens</h3><div class="choices" id="round-choices"></div></section>
<section class="popover" id="time-pop" hidden>
  <h3>Timeframe</h3>
  <div class="choices" id="presets"></div>
  <div class="hist" id="hist" role="slider" aria-label="Issue activity per 30 minutes"></div>
  <div class="range"><input id="range-from" type="range" min="0" max="47" value="0" aria-label="Window starts at histogram bucket"><input id="range-to" type="range" min="0" max="47" value="47" aria-label="Window ends at histogram bucket"></div>
  <div class="custom"><label>From · IST<input id="from" type="text" inputmode="numeric" placeholder="2026-11-24 09:30" autocomplete="off"></label><label>To · IST<input id="to" type="text" inputmode="numeric" placeholder="2026-11-24 12:45" autocomplete="off"></label></div>
  <div class="snap" id="snaps"></div>
</section>
<main id="main"><div class="error" id="error" hidden></div><div id="content"></div></main>
<div id="layer"></div>
