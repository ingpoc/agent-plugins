name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: scripts/check.py
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comet optional test deps
        run: python3 -m pip install --quiet 'websockets==16.0' Pillow
      - name: Repo checks
        run: python3 scripts/check.py
        env:
          CI: true
